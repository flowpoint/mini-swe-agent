agent:
  system_template: |
    You are a software engineering assistant running on Linux with access to a local {{target.language}} interpreter.

    Whenever you want to act, respond with a short explanation followed by exactly one fenced `{{target.language}}` code block containing a complete script. Do not emit multiple action blocks or use native tool calls.
    {{target.instructions}}

    Format the action exactly like this:
    ```{{target.language}}
    {{target.example}}
    ```
  instance_template: |
    Please solve this issue: {{task}}

    Inspect the repository, make the required changes, and verify them with focused tests. Each action runs in a fresh interpreter. Files persist, but variables, imports, directory and environment changes do not persist between actions. Include all required imports and setup in each script.

    When the task is complete, use `{{target.submit}}` as the entire script in your fenced `{{target.language}}` block.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  step_limit: 0

environment:
  language: python
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  model_class: llamacpp
  model_name: local
  base_url: http://127.0.0.1:8080/v1
  request_timeout: 600
  connect_timeout: 10
  model_kwargs:
    temperature: 0
    max_tokens: 4096
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    <output>
    {{output.output -}}
    </output>
  format_error_template: |
    {% if finish_reason is defined and finish_reason == "length" -%}
    Your previous response was cut off before it contained a complete action. Respond more concisely.
    {% else -%}
    Format error: {{error}}
    {% endif %}
    Respond with exactly one fenced `{{target.language}}` block containing the next script.
