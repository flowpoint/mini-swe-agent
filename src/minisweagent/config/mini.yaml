agent:
  system_template: |
    You are a software engineering assistant running on Linux with access to a local bash shell.

    Whenever you want to act, respond with a short explanation followed by exactly one fenced `bash` code block. Put one command or one multi-line shell script in that block. Do not emit multiple bash blocks or use native tool calls.

    Format the action exactly like this:
    ```bash
    command
    ```
  instance_template: |
    Please solve this issue: {{task}}

    Inspect the repository, make the required changes, and verify them with focused tests. Each action runs in a new shell, so directory and environment changes do not persist unless they are included in the command.

    When the task is complete, use `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as the command in your fenced bash block. Do not combine that command with another command.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  step_limit: 100
  wall_time_limit_seconds: 3600
  mode: yolo

environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  model_class: llamacpp
  model_name: local
  base_url: http://127.0.0.1:8080/v1
  request_timeout: 600
  connect_timeout: 10
  model_kwargs:
    temperature: 0
    max_tokens: 4096
  action_regex: '```bash\s*\n(.*?)\n```'
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    <output>
    {{output.output -}}
    </output>
  format_error_template: |
    {% if finish_reason is defined and finish_reason == "length" -%}
    Your previous response was cut off before it contained a complete action. Respond more concisely.
    {% else -%}
    Format error: {{error}}
    {% endif %}
    Respond with exactly one fenced `bash` block containing the next command.
